[project]
name = "market_analysis_agent"
version = "0.1.0"
description = "market-analysis-agent using crewAI"
authors = [{ name = "Amit Verma", email = "amitfromus@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "litellm>=1.75.3",
]

[project.scripts]
market_analysis_agent = "market_analysis_agent.main:run"
run_crew = "market_analysis_agent.main:run"
train = "market_analysis_agent.main:train"
replay = "market_analysis_agent.main:replay"
test = "market_analysis_agent.main:test"
run_with_trigger = "market_analysis_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
